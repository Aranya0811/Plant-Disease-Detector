data_dir: "data/PlantVillage/color"

selected_classes:
  - "Tomato___healthy"
  - "Tomato___Early_blight"
  - "Tomato___Late_blight"
  - "Tomato___Leaf_Mold"
  - "Potato___healthy"
  - "Potato___Early_blight"
  - "Potato___Late_blight"
  - "Pepper__bell___healthy"
  - "Pepper__bell___Bacterial_spot"
  - "Apple___Apple_scab"

image_size: 224
batch_size: 32
num_epochs: 10
learning_rate: 0.001
num_workers: 0
train_ratio: 0.70
val_ratio: 0.15
test_ratio: 0.15
random_seed: 42

model_name: "resnet18"
freeze_backbone: true
unfreeze_epoch: 5   

model_save_path: "models/plant_disease_resnet18.pt"
class_map_path: "models/class_map.json"
logs_dir: "logs"

confidence_threshold: 0.50
apply_clahe: true
apply_leaf_mask: false

api_host: "0.0.0.0"
api_port: 8000
